spring:
  application:
    name: cengkihtrack-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/cengkihtrack}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

server:
  port: 8080
  servlet:
    context-path: /

app:
  jwt:
    secret: ${JWT_SECRET:cengkihtrack-super-secret-key-for-jwt-signing-must-be-at-least-256-bits-long}
    expiration-ms: 86400000  # 24 jam

logging:
  level:
    com.cengkihtrack: DEBUG
    org.springframework.security: INFO
    org.flywaydb: INFO
